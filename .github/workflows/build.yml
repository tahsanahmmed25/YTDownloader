name: Build — Windows, Linux & macOS
 
on:
  push:
    branches: [main, master]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # TESTS — gate all release artifacts
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Tests and smoke checks
    runs-on: ubuntu-22.04

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libgl1
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 \
            libxcb-cursor0 libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Syntax smoke check
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run automated tests
        run: python -m pytest

      - name: Dependency vulnerability scan
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

  # ══════════════════════════════════════════════════════════════════════════
  # RELEASE PREP — create the GitHub Release before platform jobs upload assets
  # ══════════════════════════════════════════════════════════════════════════
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Create release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true

      - name: Skip release creation for non-tag build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Non-tag build; no GitHub Release will be created."

  # ══════════════════════════════════════════════════════════════════════════
  # LINUX — AppImage
  # ══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            libxcb-xinerama0 libxcb-cursor0 \
            libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libgl1 libegl1 libopengl0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -c "import yt_dlp; print('yt-dlp version:', yt_dlp.version.__version__)"

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean -y YTDownloaderPro_linux.spec

      - name: Download verified appimagetool
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ${{ vars.APPIMAGETOOL_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$APPIMAGETOOL_SHA256" ]; then echo "Warning: APPIMAGETOOL_SHA256 not set. Skipping verification."; fi
          curl --fail --location --proto '=https' --tlsv1.2 -o appimagetool-x86_64.AppImage "$APPIMAGETOOL_URL"
          if [ -n "$APPIMAGETOOL_SHA256" ]; then
            echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          else
            echo "Warning: APPIMAGETOOL_SHA256 not set. Skipping verification."
          fi
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          set -euo pipefail
          APPDIR="dist/YTDownloaderPro.AppDir"
          mkdir -p "$APPDIR/usr/bin"

          # Copy PyInstaller bundle
          cp -r dist/YTDownloaderPro/. "$APPDIR/usr/bin/"

          # Desktop entry
          cat > "$APPDIR/YTDownloaderPro.desktop" <<'EOF'
          [Desktop Entry]
          Name=YTDownloaderPro
          Exec=YTDownloaderPro
          Icon=YTDownloaderPro
          Type=Application
          Categories=AudioVideo;Network;
          Comment=YTDownloaderPro - YouTube Video Downloader
          EOF

          # Icon
          cp icons/download.png "$APPDIR/YTDownloaderPro.png"

          # AppRun
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/YTDownloaderPro" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          mkdir -p dist_installer
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" "dist_installer/YTDownloaderPro-linux-x86_64.AppImage"

      - name: Install packaging tools (alien and rpm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends alien rpm

      - name: Build DEB, RPM, and TAR.GZ packages
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="3.0.0"
          fi

          # 1. Build .deb package
          DEBDIR="dist/debian"
          mkdir -p "$DEBDIR/opt/YTDownloaderPro"
          mkdir -p "$DEBDIR/usr/bin"
          mkdir -p "$DEBDIR/usr/share/applications"
          mkdir -p "$DEBDIR/usr/share/pixmaps"
          mkdir -p "$DEBDIR/DEBIAN"

          cp -r dist/YTDownloaderPro/. "$DEBDIR/opt/YTDownloaderPro/"

          echo -e '#!/bin/bash\nexec /opt/YTDownloaderPro/YTDownloaderPro "$@"' > "$DEBDIR/usr/bin/YTDownloaderPro"
          chmod +x "$DEBDIR/usr/bin/YTDownloaderPro"

          {
            echo "[Desktop Entry]"
            echo "Name=YTDownloaderPro"
            echo "Exec=YTDownloaderPro"
            echo "Icon=YTDownloaderPro"
            echo "Type=Application"
            echo "Categories=AudioVideo;Network;"
            echo "Comment=YTDownloaderPro - YouTube Video Downloader"
          } > "$DEBDIR/usr/share/applications/YTDownloaderPro.desktop"

          cp icons/download.png "$DEBDIR/usr/share/pixmaps/YTDownloaderPro.png"

          {
            echo "Package: ytdownloaderpro"
            echo "Version: ${VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: Tahsan Ahmmed <tahsanahmmed25@gmail.com>"
            echo "Description: Fast YouTube downloader with clean UI, queue management, subtitles, themes, and dark mode."
          } > "$DEBDIR/DEBIAN/control"

          dpkg-deb --build "$DEBDIR" "dist_installer/YTDownloaderPro-linux-amd64.deb"

          # 2. Build .rpm package using alien from the .deb
          alien --to-rpm --scripts dist_installer/YTDownloaderPro-linux-amd64.deb
          mv ytdownloaderpro-*.rpm dist_installer/YTDownloaderPro-linux-x86_64.rpm

          # 3. Build portable .tar.gz package
          tar -czf "dist_installer/YTDownloaderPro-linux-x86_64.tar.gz" -C dist YTDownloaderPro

      - name: Verify and checksum Linux packages
        run: |
          set -euo pipefail
          test -s dist_installer/YTDownloaderPro-linux-x86_64.AppImage
          test -s dist_installer/YTDownloaderPro-linux-amd64.deb
          test -s dist_installer/YTDownloaderPro-linux-x86_64.rpm
          test -s dist_installer/YTDownloaderPro-linux-x86_64.tar.gz
          
          sha256sum dist_installer/YTDownloaderPro-linux-x86_64.AppImage | tee dist_installer/SHA256SUMS-linux.txt
          sha256sum dist_installer/YTDownloaderPro-linux-amd64.deb >> dist_installer/SHA256SUMS-linux.txt
          sha256sum dist_installer/YTDownloaderPro-linux-x86_64.rpm >> dist_installer/SHA256SUMS-linux.txt
          sha256sum dist_installer/YTDownloaderPro-linux-x86_64.tar.gz >> dist_installer/SHA256SUMS-linux.txt

      - name: Smoke test Linux AppImage
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 15s dist_installer/YTDownloaderPro-linux-x86_64.AppImage
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "AppImage smoke test failed with exit code $code" >&2
            exit "$code"
          fi
          echo "AppImage smoke test passed (exit code $code)."

      - name: Upload Linux packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            dist_installer/YTDownloaderPro-linux-x86_64.AppImage \
            dist_installer/YTDownloaderPro-linux-amd64.deb \
            dist_installer/YTDownloaderPro-linux-x86_64.rpm \
            dist_installer/YTDownloaderPro-linux-x86_64.tar.gz \
            dist_installer/SHA256SUMS-linux.txt \
            --clobber

  # ══════════════════════════════════════════════════════════════════════════
  # WINDOWS — Inno Setup installer
  # ══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -c "import yt_dlp; print('yt-dlp version:', yt_dlp.version.__version__)"

      - name: Download verified yt-dlp.exe
        shell: pwsh
        run: |
          python -c "import ytdlp_exe_manager; raise SystemExit(0 if ytdlp_exe_manager.ensure_ytdlp_exe(force=True) else 1)"
          Write-Host "Downloaded yt-dlp.exe ($((Get-Item yt-dlp.exe).Length) bytes)"

      - name: Download verified FFmpeg
        shell: pwsh
        env:
          YTDL_FFMPEG_WIN_ZIP_SHA256: ${{ vars.YTDL_FFMPEG_WIN_ZIP_SHA256 }}
          YTDL_ALLOW_UNVERIFIED_FFMPEG_DOWNLOADS: "true"
        run: |
          if (-not $env:YTDL_FFMPEG_WIN_ZIP_SHA256) { Write-Warning "Repository variable YTDL_FFMPEG_WIN_ZIP_SHA256 is not set. Skipping verification." }
          python -c "import ffmpeg_manager; raise SystemExit(0 if ffmpeg_manager.ensure_ffmpeg(force=True) else 1)"
          Write-Host "Downloaded ffmpeg.exe + ffprobe.exe"

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean -y YTDownloaderPro.spec

      - name: Copy binaries into dist
        shell: pwsh
        run: |
          Copy-Item "yt-dlp.exe"   "dist\YTDownloaderPro\yt-dlp.exe"   -Force
          Copy-Item "ffmpeg.exe"   "dist\YTDownloaderPro\ffmpeg.exe"   -Force
          Copy-Item "ffprobe.exe"  "dist\YTDownloaderPro\ffprobe.exe"  -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "YTDownloaderPro.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Build portable Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/YTDownloaderPro" -DestinationPath "dist_installer/YTDownloaderPro-windows-x64.zip" -Force

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if (-not $version -or $version -eq "main" -or $version -eq "master") { $version = "3.0.0" }
          $distDir = (Resolve-Path "dist/YTDownloaderPro").Path

          # Generate WiX source with file harvesting
          $wxsContent = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="YTDownloaderPro"
                     Manufacturer="Tahsan Ahmmed"
                     Version="$version"
                     UpgradeCode="7B3A4E5F-1C2D-4A6B-9E8F-0D1C2B3A4E5F">
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <StandardDirectory Id="ProgramFiles6432Folder">
                <Directory Id="INSTALLFOLDER" Name="YTDownloaderPro">
                  <Files Include="$distDir\**" />
                </Directory>
              </StandardDirectory>
            </Package>
          </Wix>
          "@

          $wxsContent | Set-Content -Path "YTDownloaderPro.wxs" -Encoding UTF8
          wix build YTDownloaderPro.wxs -o dist_installer/YTDownloaderPro-windows-x64.msi
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "MSI build failed — skipping MSI package"
            # Create empty marker so downstream steps know to skip
            "MSI_SKIPPED" | Set-Content -Path "dist_installer/.msi_skipped"
          }

      - name: Verify and checksum Windows packages
        shell: pwsh
        run: |
          if (-not (Test-Path "dist_installer/YTDownloaderPro-Setup.exe")) {
            throw "Installer was not produced"
          }
          if (-not (Test-Path "dist_installer/YTDownloaderPro-windows-x64.zip")) {
            throw "Portable ZIP was not produced"
          }
          $hashExe = (Get-FileHash "dist_installer/YTDownloaderPro-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash "dist_installer/YTDownloaderPro-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hashExe  YTDownloaderPro-Setup.exe" | Set-Content -Encoding ascii "dist_installer/SHA256SUMS-windows.txt"
          "$hashZip  YTDownloaderPro-windows-x64.zip" | Add-Content -Encoding ascii "dist_installer/SHA256SUMS-windows.txt"
          if (Test-Path "dist_installer/YTDownloaderPro-windows-x64.msi") {
            $hashMsi = (Get-FileHash "dist_installer/YTDownloaderPro-windows-x64.msi" -Algorithm SHA256).Hash.ToLower()
            "$hashMsi  YTDownloaderPro-windows-x64.msi" | Add-Content -Encoding ascii "dist_installer/SHA256SUMS-windows.txt"
          }

      - name: Upload Windows packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload ${{ github.ref_name }} `
            dist_installer/YTDownloaderPro-Setup.exe `
            dist_installer/YTDownloaderPro-windows-x64.msi `
            dist_installer/YTDownloaderPro-windows-x64.zip `
            dist_installer/SHA256SUMS-windows.txt `
            --clobber

  # ══════════════════════════════════════════════════════════════════════════
  # macOS — DMG installer
  # ══════════════════════════════════════════════════════════════════════════
  build-mac:
    name: macOS DMG
    runs-on: macos-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -c "import yt_dlp; print('yt-dlp version:', yt_dlp.version.__version__)"

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --clean -y YTDownloaderPro.spec

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package as DMG
        run: |
          mkdir -p dist_installer
          create-dmg \
            --volname "YTDownloaderPro" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "YTDownloaderPro.app" 200 190 \
            --hide-extension "YTDownloaderPro.app" \
            --app-drop-link 600 185 \
            "dist_installer/YTDownloaderPro-macOS.dmg" \
            "dist/YTDownloaderPro.app"

      - name: Package portable macOS app
        run: |
          tar -czf dist_installer/YTDownloaderPro-macOS.app.tar.gz -C dist YTDownloaderPro.app

      - name: Verify and checksum macOS packages
        run: |
          test -s dist_installer/YTDownloaderPro-macOS.dmg
          test -s dist_installer/YTDownloaderPro-macOS.app.tar.gz
          shasum -a 256 dist_installer/YTDownloaderPro-macOS.dmg | tee dist_installer/SHA256SUMS-mac.txt
          shasum -a 256 dist_installer/YTDownloaderPro-macOS.app.tar.gz >> dist_installer/SHA256SUMS-mac.txt

      - name: Upload macOS packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            dist_installer/YTDownloaderPro-macOS.dmg \
            dist_installer/YTDownloaderPro-macOS.app.tar.gz \
            dist_installer/SHA256SUMS-mac.txt \
            --clobber

