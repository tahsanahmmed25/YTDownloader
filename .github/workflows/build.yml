name: Build — Windows & Linux
 
on:
  push:
    branches: [main, master]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # TESTS — gate all release artifacts
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Tests and smoke checks
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Syntax smoke check
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run automated tests
        run: python -m pytest

      - name: Dependency vulnerability scan
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

  # ══════════════════════════════════════════════════════════════════════════
  # RELEASE PREP — create the GitHub Release before platform jobs upload assets
  # ══════════════════════════════════════════════════════════════════════════
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Create release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true

      - name: Skip release creation for non-tag build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Non-tag build; no GitHub Release will be created."

  # ══════════════════════════════════════════════════════════════════════════
  # LINUX — AppImage
  # ══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            libxcb-xinerama0 libxcb-cursor0 \
            libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libgl1 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -c "import yt_dlp; print('yt-dlp version:', yt_dlp.version.__version__)"

      - name: Run tests before Linux build
        run: python -m pytest

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean -y YTDownloader_linux.spec

      - name: Download verified appimagetool
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ${{ vars.APPIMAGETOOL_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$APPIMAGETOOL_SHA256" || {
            echo "Repository variable APPIMAGETOOL_SHA256 is required for verified AppImage builds." >&2
            exit 1
          }
          curl --fail --location --proto '=https' --tlsv1.2 -o appimagetool-x86_64.AppImage "$APPIMAGETOOL_URL"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          set -euo pipefail
          APPDIR="dist/YTDownloader.AppDir"
          mkdir -p "$APPDIR/usr/bin"

          # Copy PyInstaller bundle
          cp -r dist/YTDownloader/. "$APPDIR/usr/bin/"

          # Desktop entry
          cat > "$APPDIR/YTDownloader.desktop" <<'EOF'
          [Desktop Entry]
          Name=YTDownloader
          Exec=YTDownloader
          Icon=YTDownloader
          Type=Application
          Categories=AudioVideo;Network;
          Comment=Simple YouTube Downloader by Tahsan
          EOF

          # Icon
          cp icons/download.png "$APPDIR/YTDownloader.png"

          # AppRun
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/lib:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/YTDownloader" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          mkdir -p dist_installer
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" "dist_installer/YTDownloader-linux-x86_64.AppImage"

      - name: Verify Linux AppImage
        run: |
          set -euo pipefail
          test -s dist_installer/YTDownloader-linux-x86_64.AppImage
          file dist_installer/YTDownloader-linux-x86_64.AppImage | grep -E "ELF|AppImage"
          sha256sum dist_installer/YTDownloader-linux-x86_64.AppImage | tee dist_installer/SHA256SUMS-linux.txt

      - name: Smoke test Linux AppImage
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 15s dist_installer/YTDownloader-linux-x86_64.AppImage
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "AppImage smoke test failed with exit code $code" >&2
            exit "$code"
          fi
          echo "AppImage smoke test passed (exit code $code)."

      - name: Upload Linux AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/YTDownloader-linux-x86_64.AppImage
            dist_installer/SHA256SUMS-linux.txt

  # ══════════════════════════════════════════════════════════════════════════
  # WINDOWS — Inno Setup installer
  # ══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -c "import yt_dlp; print('yt-dlp version:', yt_dlp.version.__version__)"

      - name: Run tests before Windows build
        run: python -m pytest

      - name: Download verified yt-dlp.exe
        shell: pwsh
        run: |
          python -c "import ytdlp_exe_manager; raise SystemExit(0 if ytdlp_exe_manager.ensure_ytdlp_exe(force=True) else 1)"
          Write-Host "Downloaded yt-dlp.exe ($((Get-Item yt-dlp.exe).Length) bytes)"

      - name: Download verified FFmpeg
        shell: pwsh
        env:
          YTDL_FFMPEG_WIN_ZIP_SHA256: ${{ vars.YTDL_FFMPEG_WIN_ZIP_SHA256 }}
        run: |
          if (-not $env:YTDL_FFMPEG_WIN_ZIP_SHA256) { Write-Warning "Repository variable YTDL_FFMPEG_WIN_ZIP_SHA256 is not set. Skipping verification." }
          python -c "import ffmpeg_manager; raise SystemExit(0 if ffmpeg_manager.ensure_ffmpeg(force=True) else 1)"
          Write-Host "Downloaded ffmpeg.exe + ffprobe.exe"

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean -y YTDownloader.spec

      - name: Copy binaries into dist
        shell: pwsh
        run: |
          Copy-Item "yt-dlp.exe"   "dist\YTDownloader\yt-dlp.exe"   -Force
          Copy-Item "ffmpeg.exe"   "dist\YTDownloader\ffmpeg.exe"   -Force
          Copy-Item "ffprobe.exe"  "dist\YTDownloader\ffprobe.exe"  -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "YTDownloader.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Verify Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path "dist_installer/YTDownloader-Setup.exe")) {
            throw "Installer was not produced"
          }
          if ((Get-Item "dist_installer/YTDownloader-Setup.exe").Length -le 0) {
            throw "Installer is empty"
          }
          $hash = (Get-FileHash "dist_installer/YTDownloader-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  YTDownloader-Setup.exe" | Set-Content -Encoding ascii "dist_installer/SHA256SUMS-windows.txt"

      - name: Upload Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/YTDownloader-Setup.exe
            dist_installer/SHA256SUMS-windows.txt
